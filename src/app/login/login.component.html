<div class="login-container">
  <div class="login-card">
    <!-- Logo Section -->
    <div class="logo-container">
      <div class="logo-box">
        <svg viewBox="0 0 100 100" class="logo-svg">
          <rect x="25" y="25" width="50" height="50" rx="10" fill="#f0f4f9" />
          <!-- A nice vector house and location pin representing real estate/urban insight -->
          <path d="M50 32 L32 50 H40 V68 H60 V50 H68 Z" fill="#1e88e5" />
          <circle cx="50" cy="52" r="4" fill="#ffffff" />
        </svg>
      </div>
    </div>

    <!-- Title and Subtitle -->
    <h2 class="title">Sisteme Giriş</h2>
    <p class="subtitle">UrbanEstate Territorial Insight System</p>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Email Input -->
      <div class="form-group">
        <label for="email">E-POSTA ADRESİ</label>
        <div class="input-wrapper" [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </span>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="isim@sirket.com"
            autocomplete="email">
        </div>
        <div class="error-msg" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
          E-posta adresi gereklidir.
        </div>
        <div class="error-msg" *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
          Geçerli bir e-posta adresi giriniz.
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="password-label-row">
          <label for="password">ŞİFRE</label>
          <a href="javascript:void(0)" class="forgot-password">Şifremi Unuttum</a>
        </div>
        <div class="input-wrapper" [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </span>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            placeholder="********"
            autocomplete="current-password">
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" aria-label="Şifre görünürlüğünü değiştir">
            <!-- Eye Show/Hide SVG -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.2 2.7-2.78 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            </svg>
          </button>
        </div>
        <div class="error-msg" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          Şifre alanı gereklidir.
        </div>
      </div>

      <!-- Remember Me -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe">
          <span class="checkmark"></span>
          Beni Hatırla
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
        <span>Giriş Yap</span>
        <span class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 11.58L11.41 16l4.59-4.59L11.41 6.83 10 8.25l2.17 2.17H3v2h9.17L10 14.58z"/>
          </svg>
        </span>
      </button>
    </form>

    <!-- Signup Redirect -->
    <div class="signup-redirect">
      <span>Hesabınız yok mu?</span>
      <a routerLink="/register">Yeni Kayıt Oluştur</a>
    </div>

    <!-- Version & Audit Text -->
    <div class="login-footer">
      <p class="footer-title">Taşınmaz Yönetim Paneli Kurumsal Erişim Sistemi</p>
      <p class="footer-version">v2.4.0</p>
    </div>
  </div>

  <!-- Info Alert Modal -->
  <div class="modal-overlay" *ngIf="isInfoAlertOpen" (click)="closeInfoAlert()">
    <div class="modal-card mini" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ infoAlertTitle }}</h3>
        <button class="modal-close-btn" (click)="closeInfoAlert()">&times;</button>
      </div>
      <div class="modal-body custom-dialog-body">
        <p class="dialog-message">{{ infoAlertMessage }}</p>
      </div>
      <div class="modal-actions dialog-actions">
        <button type="button" class="save-btn" (click)="closeInfoAlert()">Kapat</button>
      </div>
    </div>
  </div>
</div>
